name: Build APK Android and Windows

# Compile l'APK sur un runner GitHub avec le SDK Android préinstallé, et l'installateur
# Windows sur un runner Windows.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le bundle web
        run: npm run build-mobile

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v5
        with:
          name: iptv-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur Windows
        run: npm run build

      - name: Publier l'installateur Windows
        uses: actions/upload-artifact@v5
        with:
          name: iptv-manager-windows-installer
          path: release/*.exe
          if-no-files-found: error
