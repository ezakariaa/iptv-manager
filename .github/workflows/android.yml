name: Build APK Android

# Compile l'APK sur un runner GitHub : l'image ubuntu-latest embarque déjà le
# SDK Android, ce qui évite d'installer plusieurs gigaoctets de toolchain en local.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le bundle web
        run: npm run build-mobile

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
